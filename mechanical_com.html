<script>
// ===== 搜索功能 =====
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchStats = document.getElementById('searchStats');
const allRows = document.querySelectorAll('tbody tr');
const allSections = document.querySelectorAll('.table-section');

// 高亮匹配文字
function highlightText(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp(`(${keyword})`, 'gi');
  return text.replace(regex, '<span class="highlight">$1</span>');
}

searchInput.addEventListener('input', function() {
  const keyword = this.value.trim().toLowerCase();
  let matchCount = 0;

  if (keyword) {
    searchClear.style.display = 'block';
  } else {
    searchClear.style.display = 'none';
  }

  allRows.forEach(row => {
    const text = row.textContent.toLowerCase();
    const cells = row.querySelectorAll('td');
    let matched = false;

    if (keyword === '' || text.includes(keyword)) {
      matched = true;
      matchCount++;
    }

    if (matched) {
      row.classList.remove('hidden');
      // 高亮
      if (keyword) {
        cells.forEach(cell => {
          const originalText = cell.textContent;
          cell.innerHTML = highlightText(originalText, keyword);
        });
      } else {
        // 恢复原始文本
        cells.forEach(cell => {
          cell.innerHTML = cell.textContent;
        });
      }
    } else {
      row.classList.add('hidden');
    }
  });

  // 隐藏没有匹配结果的section
  allSections.forEach(section => {
    const visibleRows = section.querySelectorAll('tbody tr:not(.hidden)');
    if (visibleRows.length === 0 && keyword) {
      section.style.display = 'none';
    } else {
      section.style.display = '';
    }
  });

  // 更新统计
  if (keyword) {
    searchStats.textContent = `找到 ${matchCount} 条匹配结果`;
  } else {
    searchStats.textContent = `共收录 ` + document.querySelectorAll('tbody tr').length + ` 所院校`;
  }
});

// 清除搜索
searchClear.addEventListener('click', function() {
  searchInput.value = '';
  searchInput.dispatchEvent(new Event('input'));
  searchInput.focus();
});

// ===== 导航栏滚动高亮 =====
const navLinks = document.querySelectorAll('.nav-bar a');
const sections = document.querySelectorAll('.table-section');

window.addEventListener('scroll', () => {
  let current = '';
  sections.forEach(section => {
    const sectionTop = section.offsetTop - 60;
    if (window.scrollY >= sectionTop) {
      current = section.getAttribute('id');
    }
  });

  navLinks.forEach(link => {
    link.classList.remove('active');
    if (link.getAttribute('href') === '#' + current) {
      link.classList.add('active');
    }
  });
});

// 平滑滚动
navLinks.forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const targetId = this.getAttribute('href').substring(1);
    const targetEl = document.getElementById(targetId);
    if (targetEl) {
      window.scrollTo({
        top: targetEl.offsetTop - 50,
        behavior: 'smooth'
      });
    }
  });
});
</script>
